[project]
name = "job-tracker"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ: flake8-datetimez — bans naive datetime.now()/utcnow()/etc. Repo convention is
# backend.db.models.utc_now() (aware) everywhere; see UTCDateTime in models.py for how
# that stays compatible with SQLite storage.
select = ["E", "F", "I", "UP", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# utc_now() itself must call the banned APIs to implement the aware wrapper.
"backend/db/models.py" = ["DTZ"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
