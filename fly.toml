# fly.toml app configuration file generated for job-tracker-api-verdant-haze-8797 on 2026-07-09T03:35:06+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'job-tracker-api-verdant-haze-8797'
primary_region = 'sin'

[build]

# Authentication fails closed when APP_ENV=production: the API will not start until the
# AUTH_* secrets are set (see docs/authentication.md).
[env]
  APP_ENV = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/v1/health'

[mounts]
  source = 'job_tracker_data_sin'
  destination = '/data'

[[restart]]
  policy = 'on-failure'
  max_retries = 5

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
