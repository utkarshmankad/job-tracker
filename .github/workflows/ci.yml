name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # backend/ is now mypy-clean (fixed 2026-08) — gate the whole package so it can't
      # regress silently. ruff (lint+format) still carries pre-existing debt across
      # backend/ and tests/ (tracked separately as a cleanup task), so it stays scoped
      # to files this PR actually touches, same as before.
      - name: mypy (backend/, full package)
        run: mypy backend/
      - name: Lint/format changed Python files
        run: |
          git fetch origin main --depth=1
          CHANGED_PY=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'backend/*.py' 'tests/*.py' || true)
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files under backend/ or tests/."
          else
            echo "$CHANGED_PY"
            echo "$CHANGED_PY" | xargs ruff check
            echo "$CHANGED_PY" | xargs ruff format --check
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint changed frontend files
        run: |
          CHANGED_JS=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'frontend/src/**/*.js' 'frontend/src/**/*.jsx' | sed 's#^frontend/##' || true)
          if [ -z "$CHANGED_JS" ]; then
            echo "No changed frontend source files."
          else
            echo "$CHANGED_JS"
            echo "$CHANGED_JS" | xargs npx eslint
          fi
        working-directory: frontend

  dependency-audit:
    name: Third-Party Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # fastapi bumped to 0.141.1 (2026-08) which pins starlette>=1.0, clearing all
      # previously-ignored CVEs — no ignores needed. Keep this gate strict; if a real
      # ignore is ever needed, scope it to the specific PYSEC id with a comment and an
      # expiry/tracking link, not a blanket allowance.
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/integration -v --cov=backend --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage.xml

  smoke-tests:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Boot API and hit health endpoint
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/v1/status && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/status || (echo "smoke test failed: /status unreachable" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  coverage-gate:
    name: Coverage Check (80%)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # tests/integration alone only reaches ~55% (large surface — CLI scripts, LLM
      # extractor, gmail poller — is only exercised at the unit level). Coverage is
      # measured across tests/unit + tests/integration together to get an accurate
      # number; this doesn't reintroduce a standalone "Unit Tests" validation job,
      # it just runs unit tests here so their coverage counts toward the gate.
      - run: >
          pytest tests/unit tests/integration
          --cov=backend --cov-report=term-missing
          --cov-fail-under=80

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - dependency-audit
      - integration-tests
      - smoke-tests
      - coverage-gate
    steps:
      - run: echo "All CI checks passed — ready to merge."
