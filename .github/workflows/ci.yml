name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The pre-existing tree isn't lint/format-clean yet (legacy debt, tracked
      # separately). Gate only files this PR actually touches so new work is held to
      # the standard without retroactively failing on untouched code.
      # mypy is intentionally excluded here: it type-checks whole files, not diff
      # hunks, so scoping it to changed files still surfaces pre-existing errors in
      # code this PR didn't touch (e.g. data_store.py has 11 baseline errors on main).
      - name: Lint/format changed Python files
        run: |
          git fetch origin main --depth=1
          CHANGED_PY=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'backend/*.py' 'tests/*.py' || true)
          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files under backend/ or tests/."
          else
            echo "$CHANGED_PY"
            echo "$CHANGED_PY" | xargs ruff check
            echo "$CHANGED_PY" | xargs ruff format --check
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint changed frontend files
        run: |
          CHANGED_JS=$(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'frontend/src/**/*.js' 'frontend/src/**/*.jsx' | sed 's#^frontend/##' || true)
          if [ -z "$CHANGED_JS" ]; then
            echo "No changed frontend source files."
          else
            echo "$CHANGED_JS"
            echo "$CHANGED_JS" | xargs npx eslint
          fi
        working-directory: frontend

  dependency-audit:
    name: Third-Party Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # starlette 0.37.2 (pinned transitively by fastapi==0.110.2) has known CVEs whose
      # fix requires a fastapi major-version bump — tracked separately, not blocking CI
      # until that upgrade is scoped and tested.
      - run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-1943
          --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-2280
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/integration -v --cov=backend --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage.xml

  smoke-tests:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Boot API and hit health endpoint
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/v1/status && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/status || (echo "smoke test failed: /status unreachable" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  coverage-gate:
    name: Coverage Check (85%)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: >
          pytest tests/integration
          --cov=backend --cov-report=term-missing
          --cov-fail-under=85

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - dependency-audit
      - integration-tests
      - smoke-tests
      - coverage-gate
    steps:
      - run: echo "All CI checks passed — ready to merge."
